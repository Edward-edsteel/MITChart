<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Grafik Jarak Air</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h3 style="text-align:center;">Grafik Jarak Air (cm)</h3>
  <canvas id="chart" width="400" height="200"></canvas>
  <script>
    function drawChart(dataString) {
      const data = JSON.parse(dataString);
      const ctx = document.getElementById('chart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.timestamps,
          datasets: [{
            label: 'Jarak',
            data: data.Jarak,
            borderColor: 'green',
            backgroundColor: 'rgba(0,255,0,0.1)'
          }]
        },
        options: {
          responsive: true,
          scales: {
            x: { title: { display: true, text: 'Waktu' }},
            y: { title: { display: true, text: 'Jarak (cm)' }}
          }
        }
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (window.AppInventor) {
        const raw = window.AppInventor.getWebViewString();
        console.log("WebViewString:", raw);
        if (raw) drawChart(raw);
      } else {
        document.body.innerHTML += "<p style='color:red;'>AppInventor bridge tidak tersedia.</p>";
      }
    });
  </script>
</body>
</html>
